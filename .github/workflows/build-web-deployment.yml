name: Build Standalone Web CBT Deployment ZIP

on:
  push:
    branches:
      - work/schema-dump-export-20261119
      - fix/p0-96g-installer-private-db-config-20261120
      - fix/web-portal-usability-rbac-20261120
      - work/p1-seven-targets-20261124
      - work/limited-zip-p0-20261125
    paths:
      - '.github/workflows/build-web-deployment.yml'
      - 'backend-laravel/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-cbt-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify Web CBT deployment archive
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up PHP 8.3 and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, mbstring, openssl, pdo_mysql, xml, xmlwriter, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Prepare Laravel writable build directories
        run: |
          mkdir -p backend-laravel/bootstrap/cache
          mkdir -p backend-laravel/storage/app/private
          mkdir -p backend-laravel/storage/framework/cache/data
          mkdir -p backend-laravel/storage/framework/sessions
          mkdir -p backend-laravel/storage/framework/views
          mkdir -p backend-laravel/storage/logs

      - name: Validate locked Composer project
        working-directory: backend-laravel
        run: |
          composer validate --strict --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
          php artisan --version
          php artisan route:list --path=install --json > "$RUNNER_TEMP/installer-routes.json"
          php -r '$routes = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); $uris = array_column($routes, "uri"); foreach (["install/authorize", "install/requirements", "install/database/test", "install/migrations/run", "install/admin/save", "install/complete"] as $required) { if (!in_array($required, $uris, true)) { fwrite(STDERR, "Missing installer route: {$required}" . PHP_EOL); exit(1); } }' "$RUNNER_TEMP/installer-routes.json"
          test -f vendor/autoload.php

      - name: Assemble clean standalone deployment tree
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          SOURCE_DATE="$(git show -s --format=%cI HEAD)"
          STAGE="$RUNNER_TEMP/CBT_MADRASAH_WEB_DEPLOYMENT"
          mkdir -p "$STAGE/backend-laravel"

          rsync -a --delete \
            --include='/.env.example' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='**/.env' \
            --exclude='**/.env.*' \
            --exclude='.git/' \
            --exclude='**/.git/***' \
            --exclude='backup/' \
            --exclude='backups/' \
            --exclude='backup_before_patch/' \
            --exclude='**/backup/***' \
            --exclude='**/backups/***' \
            --exclude='**/backup_before_patch/***' \
            --exclude='**/*.before' \
            --exclude='**/*.bak' \
            --exclude='**/*.backup' \
            --exclude='**/*.orig' \
            --exclude='**/*.old' \
            --exclude='**/*~' \
            --exclude='**/*.swp' \
            --exclude='**/*.swo' \
            --exclude='**/*.tmp' \
            --exclude='**/*.temp' \
            --exclude='**/*.log' \
            --exclude='**/*.sql' \
            --exclude='**/*.dump' \
            --exclude='**/*.sqlite' \
            --exclude='**/*.sqlite3' \
            --exclude='**/*.db' \
            --exclude='**/*.ibd' \
            --exclude='**/*.pem' \
            --exclude='**/*.key' \
            --exclude='**/*.p12' \
            --exclude='**/*.pfx' \
            --exclude='**/*.jks' \
            --exclude='**/*.keystore' \
            --exclude='**/*.crt' \
            --exclude='**/*.cer' \
            --exclude='**/.DS_Store' \
            --exclude='**/Thumbs.db' \
            --exclude='**/desktop.ini' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='phpunit.xml' \
            --exclude='phpunit.mysql.xml' \
            --exclude='.phpunit.result.cache' \
            --exclude='vendor/**/phpunit.xml*' \
            --exclude='vendor/**/.phpunit.cache/***' \
            --exclude='vendor/**/.phpunit.result.cache' \
            --exclude='database/seeders/DemoDataSeeder.php' \
            --exclude='database/seeders/RuntimeTestSeeder.php' \
            --exclude='AUDIT_AWAL_SOURCE_TENANT.md' \
            --exclude='README_AUDIT_PERBAIKAN.md' \
            --exclude='check_latest.php' \
            --exclude='debug_auth.php' \
            --exclude='debug_scores.php' \
            --exclude='phase6f_seed.php' \
            --exclude='read_attempts.php' \
            --exclude='smoke_test.php' \
            --exclude='tenant_id}' \
            --exclude='storage/logs/***' \
            --exclude='storage/reports/***' \
            --exclude='storage/framework/cache/***' \
            --exclude='storage/framework/sessions/***' \
            --exclude='storage/framework/views/***' \
            --exclude='storage/app/private/***' \
            --exclude='bootstrap/cache/config.php' \
            --exclude='bootstrap/cache/routes-*.php' \
            --exclude='bootstrap/cache/events.php' \
            backend-laravel/ "$STAGE/backend-laravel/"

          mkdir -p \
            "$STAGE/backend-laravel/storage/app/private" \
            "$STAGE/backend-laravel/storage/framework/cache/data" \
            "$STAGE/backend-laravel/storage/framework/sessions" \
            "$STAGE/backend-laravel/storage/framework/views" \
            "$STAGE/backend-laravel/storage/logs" \
            "$STAGE/backend-laravel/bootstrap/cache"

          cp docs/PANDUAN_INSTALASI_WEB_CBT_MANDIRI.md "$STAGE/README_PEMASANGAN.md"
          cp docs/PANDUAN_AKTIVASI_PRE_ACTIVATION_2026.md "$STAGE/PANDUAN_AKTIVASI_PRE_ACTIVATION_2026.md"
          cp backend-laravel/DISTRIBUTION_EXCLUSIONS.md "$STAGE/CATATAN_EKSKLUSI_DISTRIBUSI.md"

          cat > "$STAGE/PACKAGE_MANIFEST.txt" <<EOF
          CBT MADRASAH — STANDALONE WEB DEPLOYMENT PACKAGE
          Source repository: zane0184/cbt_november
          Source branch: $SOURCE_BRANCH
          Source commit: $SOURCE_SHA
          Source commit date: $SOURCE_DATE
          PHP build runtime: $(php -r 'echo PHP_VERSION;')
          Composer: $(composer --version --no-ansi)
          Laravel: $(cd "$STAGE/backend-laravel" && php artisan --version)
          Package model: one isolated installation and one dedicated database per madrasah
          Publisher licensing: strict PUBLISHER remains the default
          2026 pilot mode: optional per-install PRE_ACTIVATION_2026, max 180 days, issue deadline 2026-12-31
          Android client: deferred until June 2027; not included
          Publisher Super Admin portal: not included
          Build purpose: staging/deployment candidate; not production approval
          EOF

          cd "$STAGE"
          test -s README_PEMASANGAN.md
          test -s PANDUAN_AKTIVASI_PRE_ACTIVATION_2026.md
          grep -q 'CBT_LICENSE_MODE=PUBLISHER' backend-laravel/.env.example
          test -f backend-laravel/artisan
          test -f backend-laravel/composer.json
          test -f backend-laravel/composer.lock
          test -f backend-laravel/vendor/autoload.php
          test -f backend-laravel/.env.example
          test -f backend-laravel/database/migrations/2026_11_20_100001_create_exam_proctor_assignments_table.php
          test ! -e backend-laravel/.env
          test ! -d backend-laravel/tests

          # Fail closed on forbidden files, paths, symlinks, nested archives, and embedded high-confidence secrets.
          python3 - "$STAGE" <<'PY'
          import re, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          forbidden_dirs = {"backup", "backups", "backup_before_patch", "tests", ".git", ".phpunit.cache"}
          forbidden_suffixes = {
              ".before", ".bak", ".backup", ".orig", ".old", ".swp", ".swo", ".tmp", ".temp",
              ".log", ".sql", ".dump", ".sqlite", ".sqlite3", ".db", ".ibd",
              ".pem", ".key", ".p12", ".pfx", ".jks", ".keystore", ".crt", ".cer",
              ".zip", ".tar", ".gz", ".tgz", ".7z", ".rar", ".core", ".dmp"
          }
          forbidden_names = {
              ".npmrc", ".pypirc", ".netrc", "id_rsa", "id_ed25519", "authorized_keys",
              "credentials", "secrets.json", "secrets.yml", "secrets.yaml"
          }
          secret_patterns = [
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              re.compile(rb"-----BEGIN CERTIFICATE-----"),
              re.compile(rb"(?im)^\s*(?:APP_KEY|CBT_INSTALLER_BOOTSTRAP_TOKEN|DB_PASSWORD|REDIS_PASSWORD|MAIL_PASSWORD|AWS_SECRET_ACCESS_KEY)\s*=\s*"?([A-Za-z0-9+/=_-]{16,})"?\s*(?:#.*)?$"),
              re.compile(rb"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(rb"\bgh[pousr]_[A-Za-z0-9]{20,}\b"),
              re.compile(rb"\bxox[baprs]-[A-Za-z0-9-]{10,}\b"),
              re.compile(rb"\bsk_live_[A-Za-z0-9]{16,}\b"),
              re.compile(rb"(?i)Authorization\s*:\s*Bearer\s+[A-Za-z0-9._~+/=-]{20,}")
          ]
          errors, seen = [], {}
          for item in root.rglob("*"):
              rel = item.relative_to(root).as_posix()
              folded = rel.casefold()
              if folded in seen and seen[folded] != rel:
                  errors.append(f"case-collision: {seen[folded]} <> {rel}")
              seen[folded] = rel
              if item.is_symlink():
                  errors.append(f"symlink: {rel}")
                  continue
              if not item.is_file():
                  continue
              parts = [part.casefold() for part in rel.split("/")]
              name = parts[-1]
              if any(part in forbidden_dirs for part in parts):
                  errors.append(f"forbidden directory path: {rel}")
              if rel != "backend-laravel/.env.example" and (name == ".env" or name.startswith(".env.")):
                  errors.append(f"environment file: {rel}")
              if name in forbidden_names or Path(name).suffix.casefold() in forbidden_suffixes:
                  errors.append(f"forbidden file type/name: {rel}")
              runtime_prefixes = (
                  "backend-laravel/storage/logs/",
                  "backend-laravel/storage/reports/",
                  "backend-laravel/storage/framework/cache/",
                  "backend-laravel/storage/framework/sessions/",
                  "backend-laravel/storage/framework/views/",
                  "backend-laravel/storage/app/private/",
              )
              if rel.startswith(runtime_prefixes) and name != ".gitignore":
                  errors.append(f"runtime data: {rel}")
              if rel.startswith("backend-laravel/bootstrap/cache/") and name != ".gitignore":
                  errors.append(f"generated bootstrap cache: {rel}")
              data = item.read_bytes()
              for pattern in secret_patterns:
                  if pattern.search(data):
                      errors.append(f"embedded secret pattern: {rel}")
                      break
          if errors:
              for error in errors:
                  print(error, file=sys.stderr)
              raise SystemExit("Staging security audit failed.")
          print(f"Staging security audit PASS: {sum(1 for p in root.rglob('*') if p.is_file())} files checked.")
          PY

          find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt

          cd "$RUNNER_TEMP"
          ARCHIVE="CBT_MADRASAH_WEB_DEPLOYMENT_${SOURCE_SHA:0:12}.zip"
          zip -qr "$ARCHIVE" CBT_MADRASAH_WEB_DEPLOYMENT
          unzip -t "$ARCHIVE"

          # Inspect every ZIP entry, including hidden files and normalized/case-colliding paths.
          python3 - "$ARCHIVE" <<'PY'
          import re, stat, sys, zipfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          forbidden_suffixes = {
              ".before", ".bak", ".backup", ".orig", ".old", ".swp", ".swo", ".tmp", ".temp",
              ".log", ".sql", ".dump", ".sqlite", ".sqlite3", ".db", ".ibd",
              ".pem", ".key", ".p12", ".pfx", ".jks", ".keystore", ".crt", ".cer",
              ".zip", ".tar", ".gz", ".tgz", ".7z", ".rar", ".core", ".dmp"
          }
          forbidden_dirs = {"backup", "backups", "backup_before_patch", "tests", ".git", ".phpunit.cache"}
          secret_patterns = [
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              re.compile(rb"-----BEGIN CERTIFICATE-----"),
              re.compile(rb"(?im)^\s*(?:APP_KEY|CBT_INSTALLER_BOOTSTRAP_TOKEN|DB_PASSWORD|REDIS_PASSWORD|MAIL_PASSWORD|AWS_SECRET_ACCESS_KEY)\s*=\s*"?([A-Za-z0-9+/=_-]{16,})"?\s*(?:#.*)?$"),
              re.compile(rb"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(rb"\bgh[pousr]_[A-Za-z0-9]{20,}\b"),
              re.compile(rb"\bxox[baprs]-[A-Za-z0-9-]{10,}\b"),
              re.compile(rb"\bsk_live_[A-Za-z0-9]{16,}\b"),
              re.compile(rb"(?i)Authorization\s*:\s*Bearer\s+[A-Za-z0-9._~+/=-]{20,}")
          ]
          errors, seen = [], {}
          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              for info in infos:
                  name = info.filename
                  if name.startswith("/") or "\\" in name:
                      errors.append(f"absolute/backslash path: {name}")
                  parts = PurePosixPath(name).parts
                  if ".." in parts or not parts or parts[0] != "CBT_MADRASAH_WEB_DEPLOYMENT":
                      errors.append(f"path traversal or unexpected root: {name}")
                  folded = name.rstrip("/").casefold()
                  if folded in seen:
                      errors.append(f"duplicate/case-collision: {seen[folded]} <> {name}")
                  seen[folded] = name
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      errors.append(f"symlink entry: {name}")
                  lower_parts = [p.casefold() for p in parts]
                  if any(p in forbidden_dirs for p in lower_parts):
                      errors.append(f"forbidden directory: {name}")
                  suffix = PurePosixPath(name).suffix.casefold()
                  base = PurePosixPath(name).name.casefold()
                  if suffix in forbidden_suffixes:
                      errors.append(f"forbidden file suffix: {name}")
                  if base == ".env" or (base.startswith(".env.") and name != "CBT_MADRASAH_WEB_DEPLOYMENT/backend-laravel/.env.example"):
                      errors.append(f"environment file: {name}")
                  if info.is_dir():
                      continue
                  data = zf.read(info)
                  for pattern in secret_patterns:
                      if pattern.search(data):
                          errors.append(f"embedded secret pattern: {name}")
                          break
              if not any(i.filename == "CBT_MADRASAH_WEB_DEPLOYMENT/SHA256SUMS.txt" for i in infos):
                  errors.append("SHA256SUMS.txt missing from archive")
          if errors:
              for error in errors:
                  print(error, file=sys.stderr)
              raise SystemExit("ZIP security audit failed.")
          print(f"ZIP security audit PASS: {len(infos)} entries inspected.")
          PY

          # Extract into a new, empty directory and verify every manifest entry plus full file-set coverage.
          EXTRACT_ROOT="$RUNNER_TEMP/CBT_MADRASAH_WEB_DEPLOYMENT_EXTRACTED"
          mkdir "$EXTRACT_ROOT"
          test -z "$(find "$EXTRACT_ROOT" -mindepth 1 -print -quit)"
          unzip -q "$ARCHIVE" -d "$EXTRACT_ROOT"
          EXTRACTED="$EXTRACT_ROOT/CBT_MADRASAH_WEB_DEPLOYMENT"
          test -f "$EXTRACTED/README_PEMASANGAN.md"
          test -f "$EXTRACTED/backend-laravel/artisan"
          test -f "$EXTRACTED/backend-laravel/vendor/autoload.php"
          test -f "$EXTRACTED/backend-laravel/.env.example"
          (cd "$EXTRACTED" && sha256sum -c SHA256SUMS.txt)

          python3 - "$EXTRACTED" <<'PY'
          import re, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = root / "SHA256SUMS.txt"
          expected = set()
          for line in manifest.read_text(encoding="utf-8").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
              if not match:
                  raise SystemExit(f"Invalid checksum line: {line[:100]}")
              rel = match.group(2)
              if rel.startswith("./"):
                  rel = rel[2:]
              if rel in expected:
                  raise SystemExit(f"Duplicate checksum path: {rel}")
              expected.add(rel)
          actual = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*") if p.is_file() and p.relative_to(root).as_posix() != "SHA256SUMS.txt"
          }
          if expected != actual:
              missing, extra = sorted(expected-actual), sorted(actual-expected)
              raise SystemExit(f"Manifest coverage mismatch; missing={missing[:10]} extra={extra[:10]}")
          readme = (root / "README_PEMASANGAN.md").read_text(encoding="utf-8")
          required = ["Windows Explorer", "PHP 8.3", "MySQL", ".env.example", "install/authorize", "storage/", "bootstrap/cache", "backup", "bukan sertifikat siap produksi"]
          missing = [term for term in required if term.casefold() not in readme.casefold()]
          if missing:
              raise SystemExit(f"README missing required installation topics: {missing}")
          print(f"Clean extraction and manifest coverage PASS: {len(actual)} files.")
          print("Extracted README content checks PASS.")
          PY

          unzip -Z1 "$ARCHIVE" > "$ARCHIVE.contents.txt"
          sha256sum "$ARCHIVE" | tee "$ARCHIVE.sha256"
          du -h "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload verified deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: cbt-madrasah-web-deployment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ env.ARCHIVE }}
            ${{ runner.temp }}/${{ env.ARCHIVE }}.sha256
            ${{ runner.temp }}/${{ env.ARCHIVE }}.contents.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
