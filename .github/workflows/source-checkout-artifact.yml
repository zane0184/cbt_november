name: CBT Source Checkout Artifact

on:
  push:
    branches:
      - work/docx-import-parser-20261125

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Export complete tracked repository source
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          git archive --format=zip --output="$RUNNER_TEMP/cbt-source.zip" "$GITHUB_SHA"
          unzip -t "$RUNNER_TEMP/cbt-source.zip"
          sha256sum "$RUNNER_TEMP/cbt-source.zip"

      - name: Upload exact source checkout
        uses: actions/upload-artifact@v4
        with:
          name: cbt-source-${{ github.sha }}
          path: ${{ runner.temp }}/cbt-source.zip
          if-no-files-found: error
          retention-days: 3
