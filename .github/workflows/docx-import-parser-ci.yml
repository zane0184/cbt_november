name: DOCX Import Parser CI

on:
  push:
    branches:
      - work/docx-import-parser-20261125
      - work/benchmark-cleanup-proof-20261125
      - work/p0-csv-row-limit-20261125
      - work/limited-zip-p0-20261125
      - work/guru-docx-import-e2e-20261125
      - work/coordinator-web-cbt-p0-20261125
      - work/ui-import-improvements-20261125
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docx-import-parser-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  laravel:
    name: PHP ${{ matrix.php }} / MySQL 8.0 InnoDB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cbt_ci_docx
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend-laravel
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      CBT_LICENSE_TEST_BYPASS: "true"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: cbt_ci_docx
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout exact pushed branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, ctype, fileinfo, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, curl, dom, gd, zip
          coverage: none
          tools: composer:v2

      - name: Verify exact source and disposable MySQL identity
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "mysql"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "cbt_ci_docx"
          php -r '
            $pdo = new PDO(
              "mysql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT") . ";dbname=" . getenv("DB_DATABASE"),
              getenv("DB_USERNAME"), getenv("DB_PASSWORD"),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
            );
            $row = $pdo->query("SELECT DATABASE() AS db, VERSION() AS version, @@default_storage_engine AS engine")->fetch(PDO::FETCH_ASSOC);
            if ($row["db"] !== "cbt_ci_docx" || !str_starts_with($row["version"], "8.") || strtoupper($row["engine"]) !== "INNODB") {
              fwrite(STDERR, "Disposable MySQL identity check failed.\\n");
              exit(1);
            }
            echo "Disposable DB verified: " . $row["db"] . " / MySQL " . $row["version"] . " / " . $row["engine"] . PHP_EOL;
          '

      - name: Validate Composer lock
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare Laravel runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage/framework storage/logs
          touch .env
          php artisan package:discover --ansi

      - name: Check patch whitespace against audited base
        run: git -C "$GITHUB_WORKSPACE" diff --check 3df188b338a03b8513dfeea12d80b1201399be81...$GITHUB_SHA -- . ':(exclude)backend-laravel/backups/**'

      - name: PHP lint application, migrations, and tests
        shell: bash
        run: |
          set -euo pipefail
          find app database/migrations tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Create dedicated disposable installer E2E database
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER_DB="cbt_installer_test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root -e "CREATE DATABASE \`${INSTALLER_DB}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          echo "Installer E2E disposable database created: ${INSTALLER_DB}"

      - name: Run clean-install installer E2E on separate disposable MySQL database
        env:
          CBT_INSTALLER_E2E: "1"
          CBT_INSTALLER_E2E_DB_HOST: 127.0.0.1
          CBT_INSTALLER_E2E_DB_PORT: "3306"
          CBT_INSTALLER_E2E_DB_DATABASE: cbt_installer_test_${{ github.run_id }}_${{ github.run_attempt }}
          CBT_INSTALLER_E2E_DB_USERNAME: root
          CBT_INSTALLER_E2E_DB_PASSWORD: root
        run: php artisan test tests/Feature/InstallerEndToEndTest.php --display-warnings

      - name: Print bounded installer migration diagnostic when clean-install E2E fails
        if: failure()
        run: |
          if [ -f storage/logs/laravel.log ]; then tail -c 5000 storage/logs/laravel.log; else echo "No Laravel log file was created."; fi

      - name: Run student import acceptance tests on disposable MySQL 8
        run: php artisan test tests/Feature/StudentImportTest.php --display-warnings

      - name: Run benchmark cleanup denial-path test on disposable MySQL 8
        run: php artisan test tests/Feature/Phase7dBenchmarkCommandSafetyTest.php --filter=test_temporary_mysql_schema_is_removed_when_pdf_export_fails --display-warnings

      - name: Run complete PHPUnit suite on disposable MySQL 8
        run: php artisan test --display-warnings
