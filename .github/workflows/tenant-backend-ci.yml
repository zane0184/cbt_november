name: Tenant Backend CI

on:
  push:
    branches:
      - source-import/p0-87
      - work/schema-dump-export-20261119
      - fix/web-portal-usability-rbac-20261120
      - work/web-admin-implementation-20261123
      - work/solo-web-cbt-completion-20261123
      - work/solo-web-cbt-ci-repair-20261123
      - work/solo-web-cbt-next-20261123
      - work/solo-web-cbt-completion-20261123-execution
      - work/solo-web-cbt-role-rbac-20261123
      - work/phpunit-41-root-cause-20261123
      - work/p1-seven-targets-20261124
      - work/p0-academic-provisioning-20261125
  pull_request:
    branches:
      - main
      - work/web-admin-implementation-20261123
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-backend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark-mysql-pdf:
    if: github.ref_name != 'work/p0-academic-provisioning-20261125'
    name: Disposable MySQL benchmark and PDF Policy verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cbt_ci_benchmark_control
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend-laravel
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      CBT_LICENSE_TEST_BYPASS: "true"
      CBT_BENCHMARK_ALLOW_MYSQL: "1"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: cbt_ci_benchmark_control
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, ctype, fileinfo, pdo_mysql, tokenizer, xml, curl, dom, gd, zip
          coverage: none
          tools: composer:v2
      - name: Verify disposable MySQL control database
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "mysql"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "cbt_ci_benchmark_control"
          mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USERNAME" --password="$DB_PASSWORD" --batch --skip-column-names --execute="SELECT VERSION(), @@default_storage_engine"
      - name: Validate Composer lock and install dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Prepare Laravel runtime
        run: |
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage/framework storage/logs
          touch .env
          php artisan package:discover --ansi
      - name: Run disposable MySQL 8 benchmark through ReportController and ReportPolicy
        run: php artisan benchmark:phase7d --runs=1 --driver=mysql --allow-mysql --json
      - name: Independently verify no temporary benchmark schema remains
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USERNAME" --password="$DB_PASSWORD" --batch --skip-column-names --execute="SELECT COUNT(*) FROM INFORMATION_SCHEMA.SCHEMATA WHERE LEFT(SCHEMA_NAME, 12) = 'cbt_phase7d_' AND LENGTH(SCHEMA_NAME) = 24;")"
          echo "Remaining temporary benchmark schemas: $remaining"
          test "$remaining" = "0"
      - name: Upload benchmark JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7d-benchmark-report
          path: backend-laravel/storage/reports/phase7d_benchmark_report.json
          if-no-files-found: ignore
          retention-days: 14
  laravel-mysql:
    if: github.ref_name != 'work/p0-academic-provisioning-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cbt_ci_p089
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend-laravel

    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      CBT_LICENSE_TEST_BYPASS: "true"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: cbt_ci_p089
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CBT_INSTALLER_E2E: "1"
      CBT_INSTALLER_E2E_DB_HOST: "127.0.0.1"
      CBT_INSTALLER_E2E_DB_PORT: "3306"
      CBT_INSTALLER_E2E_DB_DATABASE: "cbt_installer_test_pilot"
      CBT_INSTALLER_E2E_DB_USERNAME: root
      CBT_INSTALLER_E2E_DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, ctype, fileinfo, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, curl, dom, gd, zip
          coverage: none
          tools: composer:v2

      - name: Verify isolated MySQL identity (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "mysql"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "cbt_ci_p089"
          test "$DB_USERNAME" = "root"
          test "$DB_PASSWORD" = "root"
          php -r '
            $pdo = new PDO(
              "mysql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT") . ";dbname=" . getenv("DB_DATABASE"),
              getenv("DB_USERNAME"),
              getenv("DB_PASSWORD"),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
            );
            $row = $pdo->query("SELECT DATABASE() AS db, VERSION() AS version, @@default_storage_engine AS engine")->fetch(PDO::FETCH_ASSOC);
            if ($row["db"] !== "cbt_ci_p089" || !str_starts_with($row["version"], "8.") || strtoupper($row["engine"]) !== "INNODB") {
              fwrite(STDERR, "Disposable MySQL identity check failed.\n");
              exit(1);
            }
            echo "Disposable DB verified: " . $row["db"] . " / MySQL " . $row["version"] . " / " . $row["engine"] . PHP_EOL;
          '

      - name: Validate Composer lock and platform
        run: composer validate --no-check-publish

      - name: Install locked dependencies without Composer scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare writable Laravel runtime directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage/framework storage/logs

      - name: Discover Laravel packages explicitly
        run: php artisan package:discover --ansi

      - name: PHP lint application, migrations, and tests
        shell: bash
        run: |
          set -euo pipefail
          find app database/migrations tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Prepare empty test environment file
        run: touch .env

      - name: Create isolated disposable installer E2E database
        shell: bash
        run: |
          set -euo pipefail
          test "$CBT_INSTALLER_E2E" = "1"
          test "$CBT_INSTALLER_E2E_DB_DATABASE" = "cbt_installer_test_pilot"
          test "$CBT_INSTALLER_E2E_DB_DATABASE" != "$DB_DATABASE"
          mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USERNAME" --password="$DB_PASSWORD" \
            --execute="CREATE DATABASE IF NOT EXISTS cbt_installer_test_pilot CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Verify login identity migrations on disposable MySQL 8
        run: timeout 120s php artisan migrate:fresh --force -vvv


      - name: Run complete PHPUnit suite against disposable MySQL 8
        run: php artisan test --display-warnings

  p0-academic-installer:
    if: github.ref_name == 'work/p0-academic-provisioning-20261125'
    name: PHP 8.3 / MySQL 8.0 InnoDB — P0 Academic and Installer E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cbt_ci_p0_academic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend-laravel
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CBT_LICENSE_TEST_BYPASS: "true"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: cbt_ci_p0_academic
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CBT_INSTALLER_E2E: "1"
      CBT_INSTALLER_E2E_DB_HOST: "127.0.0.1"
      CBT_INSTALLER_E2E_DB_PORT: "3306"
      CBT_INSTALLER_E2E_DB_DATABASE: "cbt_installer_test_academic"
      CBT_INSTALLER_E2E_DB_USERNAME: root
      CBT_INSTALLER_E2E_DB_PASSWORD: root
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, ctype, fileinfo, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, curl, dom, gd, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Verify exact commit and disposable MySQL 8 InnoDB databases
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$GITHUB_SHA"
          test "$APP_ENV" = "testing"
          test "$DB_DATABASE" = "cbt_ci_p0_academic"
          test "$CBT_INSTALLER_E2E" = "1"
          test "$CBT_INSTALLER_E2E_DB_DATABASE" = "cbt_installer_test_academic"
          test "$CBT_INSTALLER_E2E_DB_DATABASE" != "$DB_DATABASE"
          php -r '
            $pdo = new PDO(
              "mysql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT") . ";dbname=" . getenv("DB_DATABASE"),
              getenv("DB_USERNAME"), getenv("DB_PASSWORD"),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
            );
            $row = $pdo->query("SELECT DATABASE() AS db, VERSION() AS version, @@default_storage_engine AS engine")->fetch(PDO::FETCH_ASSOC);
            if ($row["db"] !== "cbt_ci_p0_academic" || !str_starts_with($row["version"], "8.") || strtoupper($row["engine"]) !== "INNODB") {
              fwrite(STDERR, "Disposable MySQL identity check failed.\\n");
              exit(1);
            }
            echo "Verified " . $row["db"] . " / MySQL " . $row["version"] . " / " . $row["engine"] . PHP_EOL;
          '
          mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USERNAME" --password="$DB_PASSWORD" \
            --execute="CREATE DATABASE IF NOT EXISTS cbt_installer_test_academic CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Validate locked Composer project and install dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          composer check-platform-reqs

      - name: Prepare Laravel runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/app/private storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage
          touch .env
          php artisan package:discover --ansi
          php artisan --version

      - name: PHP lint application, migrations, seeders, and tests
        shell: bash
        run: |
          set -euo pipefail
          find app database/migrations database/seeders tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Prepare disposable test database
        run: php artisan migrate:fresh --force

      - name: Run P0 academic, Admin UI, and clean-install E2E tests only
        run: |
          php artisan test \
            tests/Feature/TenantAcademicBootstrapServiceTest.php \
            tests/Feature/AcademicYearManagementTest.php \
            tests/Feature/InstallerEndToEndTest.php \
            tests/Feature/AdminUiVerificationTest.php \
            tests/Feature/TeacherPracticeWorkflowTest.php \
            tests/Feature/StudentExamPortalTest.php \
            tests/Feature/StudentWebLoginTest.php \
            tests/Feature/WebAdminAuthTest.php \
            tests/Feature/ExamExecutionHardeningTest.php \
            tests/Feature/ExamAnswerTest.php \
            tests/Feature/ExamSnapshotTest.php \
            tests/Feature/SubmitLockingTest.php \
            tests/Feature/ServerTimeAndClockTamperingTest.php \
            tests/Feature/ScoringHardeningTest.php \
            tests/Feature/AttemptTransactionConcurrencyTest.php \
            tests/Feature/TenantIsolationTest.php \
            tests/Feature/RBACEnforcementTest.php \
            tests/Feature/StudentResultVisibilityTest.php \
            tests/Feature/ResultWorkflowTest.php \
            --display-warnings

      - name: Verify no production or shared database was targeted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_DATABASE" = "cbt_ci_p0_academic"
          test "$CBT_INSTALLER_E2E_DB_DATABASE" = "cbt_installer_test_academic"
          test "$DB_DATABASE" != "$CBT_INSTALLER_E2E_DB_DATABASE"
